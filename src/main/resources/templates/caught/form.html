<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${caught} != null ? '編輯收服紀錄' : '新增收服紀錄'"></title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        label { display: block; margin-top: 12px; }
        input, select { padding: 6px; width: 300px; }
    </style>
</head>
<body>
<h1 th:text="${caught} != null ? '編輯收服紀錄' : '新增收服紀錄'"></h1>

<form th:action="${caught} != null ? @{/caught/{id}(id=${caught.id})} : @{/caught}" method="post">

    <label>收服的寶可夢
        <select name="pokemonId" required>
            <option th:each="p : ${allPokemons}"
                    th:value="${p.id}"
                    th:selected="${p.id == selectedPokemonId}"
                    th:text="${p.pokedexNumber + ' ' + p.name}"></option>
        </select>
    </label>

    <label>暱稱(可選)
        <input type="text" name="nickname" th:value="${caught != null} ? ${caught.nickname} : ''">
    </label>

    <label>收服日期
        <input type="date" name="caughtDate"
               th:value="${caught != null} ? ${caught.caughtDate} : ${T(java.time.LocalDate).now()}">
    </label>

    <p>
        <button type="submit">儲存</button>
        <a th:href="@{/caught}">取消</a>
    </p>
</form>
</body>
</html>
