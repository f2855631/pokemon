<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我收服的寶可夢</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        img { height: 60px; }
        nav, .toolbar { margin-bottom: 16px; }
        .actions form { display: inline; }
    </style>
</head>
<body>
<nav>
    <a th:href="@{/pokemons}">寶可夢圖鑑</a> |
    <a th:href="@{/caught}">我收服的寶可夢</a>
</nav>

<h1>我收服的寶可夢</h1>

<div class="toolbar">
    <a th:href="@{/caught/new}">+ 新增收服紀錄</a>
</div>

<table>
    <thead>
    <tr>
        <th>圖片</th>
        <th>名稱</th>
        <th>屬性</th>
        <th>暱稱</th>
        <th>收服日期</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="caught : ${caughtList}">
        <td><img th:if="${caught.pokemon.imageUrl}" th:src="${caught.pokemon.imageUrl}" alt=""></td>
        <td th:text="${caught.pokemon.name}"></td>
        <td th:text="${caught.pokemon.types}"></td>
        <td th:text="${caught.nickname}"></td>
        <td th:text="${caught.caughtDate}"></td>
        <td class="actions">
            <a th:href="@{/caught/{id}/edit(id=${caught.id})}">編輯</a>
            <form th:action="@{/caught/{id}/delete(id=${caught.id})}" method="post"
                  onsubmit="return confirm('確定要放生這隻寶可夢嗎?');">
                <button type="submit">放生</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
